<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Read Check</title>
<style>
  body {
    font-family: Arial, Helvetica, sans-serif;
    margin: 40px;
    background-color: #ffffff;
    color: #222222;
  }
  h1 {
    font-size: 22px;
    margin-bottom: 20px;
    text-align: center;
  }
  table {
    border-collapse: collapse;
    margin: 0 auto;
  }
  th, td {
    border: 1px solid #cccccc;
    padding: 10px 16px;
    text-align: center;
  }
  th {
    background-color: #f2f2f2;
  }
  tr.total td {
    font-weight: bold;
    background-color: #eef7ee;
  }
</style>
</head>
<body>
<h1>Read Check Summary</h1>
<table>
  <thead>
    <tr>
      <th scope="col">Label</th>
      <th scope="col">Value</th>
    </tr>
  </thead>
  <tbody>
    <tr>
      <td>First value</td>
      <td>7</td>
    </tr>
    <tr>
      <td>Second value</td>
      <td>11</td>
    </tr>
    <tr class="total">
      <td>Total (sum)</td>
      <td>18</td>
    </tr>
  </tbody>
</table>
</body>
</html>
